  <script>
    (function () {
      var id = 'footer-sponsor-section';
      function injectSponsor() {
        if (document.getElementById(id)) return true;
        var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
        var node;
        while (node = walker.nextNode()) {
          if (node.textContent.trim() === 'Quick Actions') {
            var column = node.parentElement;
            while (column && column !== document.body) {
              column = column.parentElement;
              if (!column) break;
              var wrapper = document.createElement('div');
              wrapper.id = id;
              wrapper.innerHTML = '<span class="sponsor-label">Diamond Sponsor</span>' +
                '<span class="sponsor-title">Event Sponsored by</span>' +

                '<img src="/miniindiagrocerry.webp" alt="Mini India Grocery" class="sponsor-logo"></a>';
              column.insertBefore(wrapper, column.firstChild);
              return true;
            }
            break;
          }
        }
        return false;
      }
      function placeQuickActions() {
        var footer = document.querySelector('footer');
        if (!footer) return false;
        var walker = document.createTreeWalker(footer, NodeFilter.SHOW_TEXT, null, false);
        var node, omPara = null, quickBlock = null;
        while (node = walker.nextNode()) {
          var t = node.textContent.trim();
          if (t.indexOf('Om Namah Shivaya') !== -1 && t.indexOf('In Lord Shiva We Trust') !== -1) {
            var el = node.parentElement;
            if (el && el.nodeName === 'P') { omPara = el; break; }
          }
        }
        walker = document.createTreeWalker(footer, NodeFilter.SHOW_TEXT, null, false);
        node = null;
        while (node = walker.nextNode()) {
          if (node.textContent.trim() === 'Get Directions') {
            var el = node.parentElement;
            while (el && el !== footer) {
              var text = el.textContent || '';
              if (text.indexOf('Get Directions') !== -1 && text.indexOf('Call Temple') !== -1 && (text.indexOf('Support Temple') !== -1 || text.indexOf('Sanctity') !== -1) && el.children && el.children.length >= 3) {
                quickBlock = el; break;
              }
              el = el.parentElement;
            }
            break;
          }
        }
        if (omPara && quickBlock && omPara.parentNode) {
          omPara.parentNode.insertBefore(quickBlock, omPara.nextSibling);
          return true;
        }
        return false;
      }
      function replaceColumn() {
        var footer = document.querySelector('footer');
        if (!footer) return false;
        var walker = document.createTreeWalker(footer, NodeFilter.SHOW_ELEMENT, null, false);
        var node, toRemove = [];
        while (node = walker.nextNode()) {
          if (node.nodeName === 'H4' && node.textContent.trim() === 'Quick Actions') toRemove.push(node);
          if (node.className && typeof node.className === 'string' && node.className.indexOf('bg-white') !== -1 && node.className.indexOf('backdrop-blur') !== -1) {
            var t = node.textContent || '';
            if (t.indexOf('Today\'s Schedule') !== -1 && t.indexOf('Morning Aarti') !== -1) toRemove.push(node);
          }
        }
        toRemove.forEach(function (el) { if (el.parentNode) el.parentNode.removeChild(el); });
        var sponsor = document.getElementById('footer-sponsor-section');
        if (sponsor && sponsor.parentNode && !document.getElementById('footer-mini-india-text')) {
          var block = document.createElement('div');
          block.id = 'footer-mini-india-text';
          block.innerHTML = '<h4 class="mini-india-heading">Mini India Grocery</h4>' +
            '<p class="mini-india-para">Mini India Grocery is a valued supporter of our community, offering a wide range of authentic Indian food products across the Netherlands, Germany, Belgium, and Denmark. Their focus on quality, freshness, and traditional Indian ingredients helps families stay connected to Indian culinary culture in everyday life.</p>' +
            '<a href="/events" class="mini-india-events-btn">Events Calendar</a>';
          sponsor.parentNode.insertBefore(block, sponsor.nextSibling);
        }
        return true;
      }
      function applyFooterModifications() {
        injectSponsor();
        setTimeout(function () { placeQuickActions(); }, 100);
        setTimeout(function () { replaceColumn(); }, 400);
      }
      function runWithRetry(fn, delay, maxAttempts) {
        var attempts = 0;
        function run() {
          if (fn()) return;
          attempts++;
          if (attempts < (maxAttempts || 50)) setTimeout(run, 200);
        }
        setTimeout(run, delay);
      }
      function init() {
        runWithRetry(injectSponsor, 500);
        runWithRetry(placeQuickActions, 1200);
        runWithRetry(replaceColumn, 1000);
      }
      if (document.readyState === 'complete') init();
      else window.addEventListener('load', init);
      var debounceTimer;
      var root = document.getElementById('root');
      if (root) {
        var obs = new MutationObserver(function () {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(function () {
            var footer = document.querySelector('footer');
            if (footer && !footer.querySelector('#' + id)) applyFooterModifications();
          }, 600);
        });
        obs.observe(root, { childList: true, subtree: true });
      }
    })();

  <script>
    (function () {
      var submenuContainerId = 'calendar-submenu-container';
      function findMainNavCalendarLink() {
        var nav = document.querySelector('nav');
        if (!nav) return null;
        var links = nav.querySelectorAll('a[href="/events"]');
        for (var i = 0; i < links.length; i++) {
          var text = (links[i].textContent || '').trim();
          if (text === 'Calendar' || text === 'The Sanskars') return links[i];
        }
        var all = nav.querySelectorAll('a');
        for (var j = 0; j < all.length; j++) {
          if ((all[j].getAttribute('href') === '/events' || all[j].getAttribute('href') === '/calendar') && (all[j].textContent || '').trim().indexOf('Calendar') !== -1) return all[j];
        }
        return null;
      }
      function addCalendarSubmenu() {
        if (document.getElementById(submenuContainerId)) return true;
        var calendarLink = findMainNavCalendarLink();
        if (!calendarLink) return false;
        if (calendarLink.closest('#' + submenuContainerId)) return true;
        var parent = calendarLink.parentNode;
        if (!parent) return false;
        var wrapper = document.createElement('div');
        wrapper.id = submenuContainerId;
        wrapper.className = 'relative inline-block calendar-nav-item';
        wrapper.style.cssText = 'display:inline-flex;align-items:center;position:relative;';
        parent.insertBefore(wrapper, calendarLink);
        wrapper.appendChild(calendarLink);
        var sub = document.createElement('div');
        sub.className = 'calendar-submenu';

        wrapper.appendChild(sub);
        var hideTimer;
        function show() {
          if (hideTimer) clearTimeout(hideTimer);
          hideTimer = null;
          sub.style.display = 'flex';
        }
        function scheduleHide() {
          if (hideTimer) clearTimeout(hideTimer);
          hideTimer = setTimeout(function () { sub.style.display = 'none'; }, 180);
        }
        wrapper.addEventListener('mouseenter', show);
        wrapper.addEventListener('mouseleave', scheduleHide);
        sub.addEventListener('mouseenter', show);
        sub.addEventListener('mouseleave', scheduleHide);
        return true;

        if (addCalendarSubmenu()) return;
        setTimeout(run, 300);
